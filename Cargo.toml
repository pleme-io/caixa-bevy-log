"[package]\nname = \"bevy_log\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Provides logging for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\ntrace = [\"tracing-error\"]\ntrace_tracy_memory = [\"dep:tracy-client\"]\n\n[dependencies]\n# bevy\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\" }\nbevy_utils = { path = \"../bevy_utils\", version = \"0.19.0-dev\" }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\" }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\" }\n\n# other\ntracing-subscriber = { version = \"0.3.20\", features = [\n  \"registry\",\n  \"env-filter\",\n] }\ntracing-chrome = { version = \"0.7.0\", optional = true }\ntracing-log = \"0.2.0\"\ntracing-error = { version = \"0.2.0\", optional = true }\ntracing = { version = \"0.1\", default-features = false, features = [\"std\"] }\n\n# Tracy dependency compatibility table:\n# https://github.com/nagisa/rust_tracy_client\ntracing-tracy = { version = \"0.11.4\", optional = true }\ntracy-client = { version = \"0.18.3\", optional = true }\n\n[target.'cfg(target_os = \"android\")'.dependencies]\nandroid_log-sys = \"0.3.0\"\n\n[target.'cfg(target_arch = \"wasm32\")'.dependencies]\ntracing-wasm = \"0.2.1\"\n# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"web\",\n] }\n\n[target.'cfg(target_os = \"ios\")'.dependencies]\ntracing-oslog = \"0.3\"\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
